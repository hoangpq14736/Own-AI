services:
  ai-assistant:
    build: .
    container_name: self_learning_ai_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Live repository mount: enables in-place git updates to persist on VPS host
      - .:/app
      # Persistent storage: guarantees database & memories never disappear across restarts
      - ./data:/app/data
      # Docker socket: allows the AI assistant to inspect and supervise mirrorbot-app-1
      - /var/run/docker.sock:/var/run/docker.sock
